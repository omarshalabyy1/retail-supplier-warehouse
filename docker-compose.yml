# The warehouse (Postgres), on 127.0.0.1 only.
#
#   docker compose up -d     # warehouse on localhost:5441
#   docker compose down -v   # stops it and deletes the data

name: retail-supplier-warehouse

services:
  warehouse:
    image: postgres:17
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data

volumes:
  warehouse-data:

  <text x="382" y="264" class="col">customer_id</text><text x="618" y="264" class="key" fill="#1D4ED8" text-anchor="end">FK</text>
  <text x="382" y="287" class="col">order_date</text><text x="618" y="287" class="key" fill="#1D4ED8" text-anchor="end">FK</text>

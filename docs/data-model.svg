<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 561" width="1000" height="561" role="img" aria-label="The Semantic layer's star schema: fact_order_items (112,650 rows, one per order item, key order_id plus order_item_id) joins four dimensions, many to one: dim_product (32,951 rows) on product_id, dim_seller (3,095) on seller_id, dim_customer (99,441) on customer_id and dim_date (1,096 days) on order_date. is_delivered, is_late, delivery_days, late_rank and is_top_late_seller come from Gold-layer rules.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 13.5px; fill: #475569; }
    .layer { font-size: 13px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 11.5px; fill: #506078; }
    .name { font-size: 12.5px; fill: #0E1630; }
    .bold { font-size: 13px; font-weight: 700; fill: #0E1630; }
    .count { font-size: 11px; fill: #506078; }
    .body { font-size: 12px; fill: #334155; }
    .col { font-size: 12.5px; fill: #0E1630; }
    .key { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.3; }
  </style>
  <rect x="1" y="1" width="998" height="559" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="40" y="50" class="title">The star schema (Semantic layer)</text>
  <text x="40" y="74" class="sub">One fact row per order item, four dimensions around it. Every join is many to one, on a single key.</text>
  <path d="M370 213.5 C325.0 213.5 325.0 167.5 280 167.5" class="edge" stroke="#94A3B8"/>
  <text x="360" y="208.5" class="key" fill="#475569" text-anchor="end">*</text><text x="288" y="162.5" class="key" fill="#475569" text-anchor="start">1</text>
  <path d="M370 236.5 C325.0 236.5 325.0 347.5 280 347.5" class="edge" stroke="#94A3B8"/>
  <text x="360" y="231.5" class="key" fill="#475569" text-anchor="end">*</text><text x="288" y="342.5" class="key" fill="#475569" text-anchor="start">1</text>
  <path d="M630 259.5 C675.0 259.5 675.0 167.5 720 167.5" class="edge" stroke="#94A3B8"/>
  <text x="640" y="254.5" class="key" fill="#475569" text-anchor="start">*</text><text x="712" y="162.5" class="key" fill="#475569" text-anchor="end">1</text>
  <path d="M630 282.5 C675.0 282.5 675.0 347.5 720 347.5" class="edge" stroke="#94A3B8"/>
  <text x="640" y="277.5" class="key" fill="#475569" text-anchor="start">*</text><text x="712" y="342.5" class="key" fill="#475569" text-anchor="end">1</text>
  <rect x="370" y="110" width="260" height="399" rx="10" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
  <path d="M370 120 a10 10 0 0 1 10 -10 h240 a10 10 0 0 1 10 10 v36 h-260 Z" fill="#2563EB"/>
  <text x="382" y="130" class="name" font-weight="700" style="fill:#FFFFFF">fact_order_items</text><text x="382" y="147" class="count" style="fill:#FFFFFF">112,650 rows</text>
  <text x="382" y="172" class="col">order_id</text><text x="618" y="172" class="key" fill="#B45309" text-anchor="end">PK</text>
  <text x="382" y="195" class="col">order_item_id</text><text x="618" y="195" class="key" fill="#B45309" text-anchor="end">PK</text>
  <text x="382" y="218" class="col">product_id</text><text x="618" y="218" class="key" fill="#1D4ED8" text-anchor="end">FK</text>

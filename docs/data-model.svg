  <text x="382" y="402" class="col">delivered_date</text>
  <text x="382" y="425" class="col">is_delivered</text><text x="618" y="425" class="key" fill="#92400E" text-anchor="end">Gold</text>
  <text x="382" y="448" class="col">is_late</text><text x="618" y="448" class="key" fill="#92400E" text-anchor="end">Gold</text>
  <text x="382" y="471" class="col">delivery_days</text><text x="618" y="471" class="key" fill="#92400E" text-anchor="end">Gold</text>
  <text x="382" y="494" class="col">review_score</text>
  <rect x="40" y="110" width="240" height="100" rx="10" fill="#F8FAFC" stroke="#14B8A6" stroke-width="1.5"/>
  <path d="M40 120 a10 10 0 0 1 10 -10 h220 a10 10 0 0 1 10 10 v36 h-240 Z" fill="#14B8A6"/>
  <text x="52" y="130" class="name" font-weight="700" style="fill:#0B1220">dim_product</text><text x="52" y="147" class="count" style="fill:#0B1220">32,951 rows</text>
  <text x="52" y="172" class="col">product_id</text><text x="268" y="172" class="key" fill="#B45309" text-anchor="end">PK</text>
  <text x="52" y="195" class="col">department</text>
  <rect x="40" y="290" width="240" height="192" rx="10" fill="#F8FAFC" stroke="#14B8A6" stroke-width="1.5"/>
  <path d="M40 300 a10 10 0 0 1 10 -10 h220 a10 10 0 0 1 10 10 v36 h-240 Z" fill="#14B8A6"/>
  <text x="52" y="310" class="name" font-weight="700" style="fill:#0B1220">dim_seller</text><text x="52" y="327" class="count" style="fill:#0B1220">3,095 rows</text>
  <text x="52" y="352" class="col">seller_id</text><text x="268" y="352" class="key" fill="#B45309" text-anchor="end">PK</text>
  <text x="52" y="375" class="col">zip_prefix</text>
  <text x="52" y="398" class="col">city</text>
  <text x="52" y="421" class="col">state</text>
  <text x="52" y="444" class="col">late_rank</text><text x="268" y="444" class="key" fill="#92400E" text-anchor="end">Gold</text>
  <text x="52" y="467" class="col">is_top_late_seller</text><text x="268" y="467" class="key" fill="#92400E" text-anchor="end">Gold</text>
  <rect x="720" y="110" width="240" height="169" rx="10" fill="#F8FAFC" stroke="#14B8A6" stroke-width="1.5"/>
  <path d="M720 120 a10 10 0 0 1 10 -10 h220 a10 10 0 0 1 10 10 v36 h-240 Z" fill="#14B8A6"/>
  <text x="732" y="130" class="name" font-weight="700" style="fill:#0B1220">dim_customer</text><text x="732" y="147" class="count" style="fill:#0B1220">99,441 rows</text>
  <text x="732" y="172" class="col">customer_id</text><text x="948" y="172" class="key" fill="#B45309" text-anchor="end">PK</text>
  <text x="732" y="195" class="col">customer_unique_id</text>
  <text x="732" y="218" class="col">zip_prefix</text>
  <text x="732" y="241" class="col">city</text>
  <text x="732" y="264" class="col">state</text>
  <rect x="720" y="290" width="240" height="238" rx="10" fill="#F8FAFC" stroke="#14B8A6" stroke-width="1.5"/>
  <path d="M720 300 a10 10 0 0 1 10 -10 h220 a10 10 0 0 1 10 10 v36 h-240 Z" fill="#14B8A6"/>
  <text x="732" y="310" class="name" font-weight="700" style="fill:#0B1220">dim_date</text><text x="732" y="327" class="count" style="fill:#0B1220">1,096 rows</text>
  <text x="732" y="352" class="col">date</text><text x="948" y="352" class="key" fill="#B45309" text-anchor="end">PK</text>
  <text x="732" y="375" class="col">year</text>
  <text x="732" y="398" class="col">quarter</text>
  <text x="732" y="421" class="col">month_number</text>
  <text x="732" y="444" class="col">month_name</text>
  <text x="732" y="467" class="col">year_month</text>
  <text x="732" y="490" class="col">weekday_number</text>
  <text x="732" y="513" class="col">weekday_name</text>
  <text x="40" y="537" class="where">PK primary key · FK foreign key · Gold: set by a Gold-layer rule · 1 to * one dimension row to many fact rows</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 561" width="1000" height="561" role="img" aria-label="Star schema: fact_order_items (112,650 rows, one per order item, key order_id plus order_item_id) joins four dimensions, many to one: dim_product (32,951 rows) on product_id, dim_seller (3,095) on seller_id, dim_customer (99,441) on customer_id and dim_date (1,096 days) on order_date.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>

  <rect x="205" y="196" width="170" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.7"/><text x="215" y="217" class="name">order_items</text><text x="367" y="217" class="count" text-anchor="end">112,650</text>
  <rect x="205" y="242" width="170" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.7"/><text x="215" y="263" class="name">reviews</text><text x="367" y="263" class="count" text-anchor="end">99,224</text>
  <rect x="205" y="288" width="170" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.7"/><text x="215" y="309" class="name">customers</text><text x="367" y="309" class="count" text-anchor="end">99,441</text>

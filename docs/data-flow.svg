<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 568" width="1000" height="568" role="img" aria-label="Data flow, table by table, left to right through six layers: 7 input files load into 7 Bronze tables (446,875 rows, 0 refused to bronze.quarantine); Silver cleans them into 7 views (reviews 99,224 to 98,673, one per order); Gold builds order_delivery (99,441 orders) and seller_late_rank (3,095 sellers); Semantic builds fact_order_items (112,650 rows) and four dimensions from Silver and Gold; Analytical has kpis_by_month (24 months), review_by_lateness and kpis_by_seller; Reporting, the notebook reads Analytical and Semantic, Power BI imports the five Semantic tables.">

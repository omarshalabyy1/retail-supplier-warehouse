<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-label="Data flow, table by table: 7 input files load into 7 raw tables (446,875 rows), 6 staging views clean them, and the star schema builds fact_order_items (112,650 rows) from order items, orders and reviews, plus four dimensions: date, customer, seller (ranked by late items from the fact) and product (with its department). Power BI imports the star schema into three pages.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .layer { font-size: 14px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 12px; fill: #94A3B8; }
    .name { font-size: 13px; fill: #F1F5F9; }
    .count { font-size: 11.5px; fill: #94A3B8; }
    .col { font-size: 12.5px; fill: #E2E8F0; }
    .key { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.4; }
  </style>
  <rect width="1000" height="510" rx="22" fill="url(#bg)"/>
  <text x="40" y="50" class="title">Data flow, table by table</text>
  <text x="40" y="74" class="sub">Every table in the warehouse and the tables it is built from. load.py fills raw, dbt builds the rest.</text>
  <rect x="30" y="96" width="140" height="26" rx="13" fill="#94A3B8"/><text x="100.0" y="114" class="layer" text-anchor="middle">Input files</text>
  <text x="100.0" y="138" class="where" text-anchor="middle">data/input, CSV</text>
  <rect x="205" y="96" width="170" height="26" rx="13" fill="#3B82F6"/><text x="290.0" y="114" class="layer" text-anchor="middle">1  Raw</text>
  <text x="290.0" y="138" class="where" text-anchor="middle">schema raw, text</text>
  <rect x="410" y="96" width="170" height="26" rx="13" fill="#0EA5E9"/><text x="495.0" y="114" class="layer" text-anchor="middle">2  Staging</text>
  <text x="495.0" y="138" class="where" text-anchor="middle">schema staging, views</text>
  <rect x="615" y="96" width="175" height="26" rx="13" fill="#14B8A6"/><text x="702.5" y="114" class="layer" text-anchor="middle">3  Star schema</text>
  <text x="702.5" y="138" class="where" text-anchor="middle">schema marts, tables</text>
  <rect x="825" y="96" width="145" height="26" rx="13" fill="#22C55E"/><text x="897.5" y="114" class="layer" text-anchor="middle">4  Power BI</text>
  <text x="897.5" y="138" class="where" text-anchor="middle">import mode</text>
  <rect x="30" y="150" width="140" height="308" rx="10" fill="#13233D" stroke="#94A3B8" stroke-opacity="0.7"/>
  <text x="44" y="270" class="name" font-weight="700">7 CSV files</text>
  <text x="44" y="290" class="count" style="fill:#CBD5E1;font-size:12.5px"></text>
  <text x="44" y="310" class="count" style="fill:#CBD5E1;font-size:12.5px">6 store exports:</text>
  <text x="44" y="330" class="count" style="fill:#CBD5E1;font-size:12.5px">orders, items,</text>
  <text x="44" y="350" class="count" style="fill:#CBD5E1;font-size:12.5px">reviews, customers,</text>
  <text x="44" y="370" class="count" style="fill:#CBD5E1;font-size:12.5px">sellers, products</text>
  <text x="44" y="390" class="count" style="fill:#CBD5E1;font-size:12.5px"></text>
  <text x="44" y="410" class="count" style="fill:#CBD5E1;font-size:12.5px">+ departments.csv</text>

  <rect x="205" y="380" width="170" height="32" rx="7" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.7"/><text x="215" y="401" class="name">products</text><text x="367" y="401" class="count" text-anchor="end">32,951</text>

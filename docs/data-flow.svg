  <rect x="410" y="196" width="170" height="32" rx="7" fill="#13233D" stroke="#0EA5E9" stroke-opacity="0.7"/><text x="420" y="217" class="name">stg_order_items</text><text x="572" y="217" class="count" text-anchor="end">112,650</text>
  <rect x="410" y="242" width="170" height="32" rx="7" fill="#13233D" stroke="#0EA5E9" stroke-opacity="0.7"/><text x="420" y="263" class="name">stg_reviews</text><text x="572" y="263" class="count" text-anchor="end">98,673</text>
  <rect x="410" y="288" width="170" height="32" rx="7" fill="#13233D" stroke="#0EA5E9" stroke-opacity="0.7"/><text x="420" y="309" class="name">stg_customers</text><text x="572" y="309" class="count" text-anchor="end">99,441</text>
  <rect x="410" y="334" width="170" height="32" rx="7" fill="#13233D" stroke="#0EA5E9" stroke-opacity="0.7"/><text x="420" y="355" class="name">stg_sellers</text><text x="572" y="355" class="count" text-anchor="end">3,095</text>
  <rect x="410" y="403.0" width="170" height="32" rx="7" fill="#13233D" stroke="#0EA5E9" stroke-opacity="0.7"/><text x="420" y="424.0" class="name">stg_products</text><text x="572" y="424.0" class="count" text-anchor="end">32,951</text>
  <rect x="615" y="150" width="175" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.7"/><text x="625" y="171" class="name">dim_date</text><text x="782" y="171" class="count" text-anchor="end">1,096</text>
  <rect x="615" y="219.0" width="175" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.7"/><text x="625" y="240.0" class="name">fact_order_items</text><text x="782" y="240.0" class="count" text-anchor="end">112,650</text>
  <rect x="615" y="288" width="175" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.7"/><text x="625" y="309" class="name">dim_customer</text><text x="782" y="309" class="count" text-anchor="end">99,441</text>
  <rect x="615" y="334" width="175" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.7"/><text x="625" y="355" class="name">dim_seller</text><text x="782" y="355" class="count" text-anchor="end">3,095</text>
  <rect x="615" y="403.0" width="175" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.7"/><text x="625" y="424.0" class="name">dim_product</text><text x="782" y="424.0" class="count" text-anchor="end">32,951</text>

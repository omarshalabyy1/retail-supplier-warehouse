<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="One warehouse, six layers, left to right, each reading only the one before it: Bronze holds the 7 input files as text with their lineage (446,875 rows, 0 rows in quarantine); Silver types and cleans them in 7 views; Gold applies the rules, late orders and the seller late rank (99,441 orders, 3,095 sellers); Semantic is the star schema (112,650 order items, 4 dimensions built from Silver and Gold); Analytical has 3 summary views; Reporting is the notebook and Power BI. ops.load_log records every load and is not a layer.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 13.5px; fill: #475569; }
    .layer { font-size: 13px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 11.5px; fill: #506078; }
    .name { font-size: 12.5px; fill: #0E1630; }
    .bold { font-size: 13px; font-weight: 700; fill: #0E1630; }
    .count { font-size: 11px; fill: #506078; }
    .body { font-size: 12px; fill: #334155; }
    .col { font-size: 12.5px; fill: #0E1630; }
    .key { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.3; }
  </style>
  <rect x="1" y="1" width="998" height="418" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="40" y="50" class="title">One warehouse, six layers</text>
  <text x="40" y="74" class="sub">Data enters on the left as it is and leaves on the right as answers. Each layer reads only the one before it.</text>
  <rect x="24" y="100" width="141" height="236" rx="14" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="34" y="112" width="121" height="26" rx="13" fill="#3B82F6"/><text x="94.5" y="130" class="layer" text-anchor="middle">1  Bronze</text>
  <text x="94.5" y="158" class="where" text-anchor="middle">schema bronze, text</text>
  <text x="36" y="186" class="body">The 7 input files as</text>
  <text x="36" y="205" class="body">they came, each row</text>
  <text x="36" y="224" class="body">with its file, row</text>
  <text x="36" y="243" class="body">number and run id</text>
  <line x1="36" y1="270" x2="153" y2="270" stroke="#E2E8F0"/>
  <text x="36" y="292" class="bold">446,875 rows</text>
  <text x="36" y="312" class="count">quarantine: 0 rows</text>
  <line x1="166" y1="218" x2="181" y2="218" class="edge" marker-end="url(#arrow)"/>
  <rect x="183" y="100" width="141" height="236" rx="14" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="1.5"/>
  <rect x="193" y="112" width="121" height="26" rx="13" fill="#0EA5E9"/><text x="253.5" y="130" class="layer" text-anchor="middle">2  Silver</text>
  <text x="253.5" y="158" class="where" text-anchor="middle">schema silver, views</text>
  <text x="195" y="186" class="body">Types and dates set,</text>
  <text x="195" y="205" class="body">names tidied, one</text>
  <text x="195" y="224" class="body">review per order,</text>
  <text x="195" y="243" class="body">keyed like the files</text>
  <line x1="195" y1="270" x2="312" y2="270" stroke="#E2E8F0"/>
  <text x="195" y="292" class="bold">7 views</text>
  <text x="195" y="312" class="count">98,673 reviews</text>
  <line x1="325" y1="218" x2="340" y2="218" class="edge" marker-end="url(#arrow)"/>
  <rect x="342" y="100" width="141" height="236" rx="14" fill="#F8FAFC" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="352" y="112" width="121" height="26" rx="13" fill="#F59E0B"/><text x="412.5" y="130" class="layer" text-anchor="middle">3  Gold</text>
  <text x="412.5" y="158" class="where" text-anchor="middle">schema gold, tables</text>
  <text x="354" y="186" class="body">The rules: delivered,</text>
  <text x="354" y="205" class="body">late (after 0 days),</text>
  <text x="354" y="224" class="body">seller late rank,</text>
  <text x="354" y="243" class="body">top 100 sellers</text>
  <line x1="354" y1="270" x2="471" y2="270" stroke="#E2E8F0"/>
  <text x="354" y="292" class="bold">99,441 orders</text>
  <text x="354" y="312" class="count">3,095 sellers</text>
  <line x1="484" y1="218" x2="499" y2="218" class="edge" marker-end="url(#arrow)"/>
  <rect x="501" y="100" width="141" height="236" rx="14" fill="#F8FAFC" stroke="#14B8A6" stroke-width="1.5"/>
  <rect x="511" y="112" width="121" height="26" rx="13" fill="#14B8A6"/><text x="571.5" y="130" class="layer" text-anchor="middle">4  Semantic</text>
  <text x="571.5" y="158" class="where" text-anchor="middle">schema semantic, tables</text>
  <text x="513" y="186" class="body">The star schema:</text>
  <text x="513" y="205" class="body">one fact per order</text>
  <text x="513" y="224" class="body">item; dimensions</text>
  <text x="513" y="243" class="body">from Silver and Gold</text>
  <line x1="513" y1="270" x2="630" y2="270" stroke="#E2E8F0"/>
  <text x="513" y="292" class="bold">112,650 items</text>
  <text x="513" y="312" class="count">4 dimensions</text>
  <line x1="643" y1="218" x2="658" y2="218" class="edge" marker-end="url(#arrow)"/>
  <rect x="660" y="100" width="141" height="236" rx="14" fill="#F8FAFC" stroke="#A855F7" stroke-width="1.5"/>
  <rect x="670" y="112" width="121" height="26" rx="13" fill="#A855F7"/><text x="730.5" y="130" class="layer" text-anchor="middle">5  Analytical</text>
  <text x="730.5" y="158" class="where" text-anchor="middle">schema analytical, views</text>
  <text x="672" y="186" class="body">Summary views over</text>
  <text x="672" y="205" class="body">the star schema: by</text>
  <text x="672" y="224" class="body">month, by seller,</text>
  <text x="672" y="243" class="body">review by lateness</text>
  <line x1="672" y1="270" x2="789" y2="270" stroke="#E2E8F0"/>
  <text x="672" y="292" class="bold">3 views</text>
  <text x="672" y="312" class="count">24 months</text>
  <line x1="802" y1="218" x2="817" y2="218" class="edge" marker-end="url(#arrow)"/>
  <rect x="819" y="100" width="141" height="236" rx="14" fill="#F8FAFC" stroke="#22C55E" stroke-width="1.5"/>
  <rect x="829" y="112" width="121" height="26" rx="13" fill="#22C55E"/><text x="889.5" y="130" class="layer" text-anchor="middle">6  Reporting</text>
  <text x="889.5" y="158" class="where" text-anchor="middle">notebook, Power BI</text>
  <text x="831" y="186" class="body">Reads Semantic and</text>
  <text x="831" y="205" class="body">Analytical only:</text>
  <text x="831" y="224" class="body">sales, suppliers,</text>
  <text x="831" y="243" class="body">late deliveries</text>
  <line x1="831" y1="270" x2="948" y2="270" stroke="#E2E8F0"/>
  <text x="831" y="292" class="bold">3 report pages</text>
  <text x="831" y="312" class="count">every README number</text>
  <rect x="24" y="352" width="936" height="36" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-dasharray="4 4"/>
  <text x="40" y="375" class="body">Not a layer: <tspan font-weight="700">ops.load_log</tspan> records every load (rows in the file, loaded, refused). One run: python load.py, then dbt run.</text>
</svg>

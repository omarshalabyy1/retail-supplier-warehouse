<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="One warehouse, six layers, left to right: the 7 input files (orders, order_items, reviews, customers, sellers, products, departments) all flow into Bronze; each layer reads only the one before it. Bronze holds the 7 input files as text with their lineage (446,875 rows, 0 rows in quarantine); Silver types and cleans them in 7 views; Gold applies the rules, late orders and the seller late rank (99,441 orders, 3,095 sellers); Semantic is the star schema (112,650 order items, 4 dimensions built from Silver and Gold); Analytical has 3 summary views; Reporting is the notebook and Power BI. ops.load_log records every load and is not a layer.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 13.5px; fill: #475569; }
    .layer { font-size: 13px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 11px; fill: #506078; }
    .name { font-size: 12.5px; fill: #0E1630; }
    .bold { font-size: 13px; font-weight: 700; fill: #0E1630; }
    .count { font-size: 11px; fill: #506078; }
    .body { font-size: 11.5px; fill: #334155; }
    .col { font-size: 12.5px; fill: #0E1630; }
    .key { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.3; }
  </style>
  <rect x="1" y="1" width="998" height="418" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="40" y="50" class="title">One warehouse, six layers</text>
  <text x="40" y="74" class="sub">Data enters on the left as it is and leaves on the right as answers. Each layer reads only the one before it.</text>
  <text x="18" y="100" class="where" style="font-weight:700">7 input files</text>
  <rect x="18" y="110" width="84" height="24" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/><text x="60" y="126" class="name" text-anchor="middle" style="font-size:11.5px">orders</text>
  <path d="M103 122 C 127 122, 125 188, 148 188" class="edge" marker-end="url(#arrow)"/>
  <rect x="18" y="142" width="84" height="24" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/><text x="60" y="158" class="name" text-anchor="middle" style="font-size:11.5px">order_items</text>
  <path d="M103 154 C 127 154, 125 198, 148 198" class="edge" marker-end="url(#arrow)"/>
  <rect x="18" y="174" width="84" height="24" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/><text x="60" y="190" class="name" text-anchor="middle" style="font-size:11.5px">reviews</text>
  <path d="M103 186 C 127 186, 125 208, 148 208" class="edge" marker-end="url(#arrow)"/>
  <rect x="18" y="206" width="84" height="24" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/><text x="60" y="222" class="name" text-anchor="middle" style="font-size:11.5px">customers</text>
  <path d="M103 218 C 127 218, 125 218, 148 218" class="edge" marker-end="url(#arrow)"/>
  <rect x="18" y="238" width="84" height="24" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/><text x="60" y="254" class="name" text-anchor="middle" style="font-size:11.5px">sellers</text>
  <path d="M103 250 C 127 250, 125 228, 148 228" class="edge" marker-end="url(#arrow)"/>
  <rect x="18" y="270" width="84" height="24" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/><text x="60" y="286" class="name" text-anchor="middle" style="font-size:11.5px">products</text>
  <path d="M103 282 C 127 282, 125 238, 148 238" class="edge" marker-end="url(#arrow)"/>
  <rect x="18" y="302" width="84" height="24" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/><text x="60" y="318" class="name" text-anchor="middle" style="font-size:11.5px">departments</text>
  <path d="M103 314 C 127 314, 125 248, 148 248" class="edge" marker-end="url(#arrow)"/>
  <rect x="150" y="100" width="122" height="236" rx="14" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="158" y="112" width="106" height="26" rx="13" fill="#3B82F6"/><text x="211.0" y="130" class="layer" text-anchor="middle">1  Bronze</text>
  <text x="211.0" y="158" class="where" text-anchor="middle">bronze, text</text>
  <text x="160" y="184" class="body">The 7 input files</text>
  <text x="160" y="202" class="body">as they came, each</text>
  <text x="160" y="220" class="body">row with its file,</text>
  <text x="160" y="238" class="body">row number, run id</text>
  <line x1="160" y1="270" x2="262" y2="270" stroke="#E2E8F0"/>
  <text x="160" y="292" class="bold">446,875 rows</text>
  <text x="160" y="312" class="count">quarantine: 0 rows</text>
  <line x1="273" y1="218" x2="286" y2="218" class="edge" marker-end="url(#arrow)"/>
  <rect x="288" y="100" width="122" height="236" rx="14" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="1.5"/>
  <rect x="296" y="112" width="106" height="26" rx="13" fill="#0EA5E9"/><text x="349.0" y="130" class="layer" text-anchor="middle">2  Silver</text>
  <text x="349.0" y="158" class="where" text-anchor="middle">silver, views</text>
  <text x="298" y="184" class="body">Types and dates</text>
  <text x="298" y="202" class="body">set, names tidied,</text>
  <text x="298" y="220" class="body">one review per</text>
  <text x="298" y="238" class="body">order, keyed like</text>
  <text x="298" y="256" class="body">the files</text>
  <line x1="298" y1="270" x2="400" y2="270" stroke="#E2E8F0"/>
  <text x="298" y="292" class="bold">7 views</text>
  <text x="298" y="312" class="count">98,673 reviews</text>
  <line x1="411" y1="218" x2="424" y2="218" class="edge" marker-end="url(#arrow)"/>
  <rect x="426" y="100" width="122" height="236" rx="14" fill="#F8FAFC" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="434" y="112" width="106" height="26" rx="13" fill="#F59E0B"/><text x="487.0" y="130" class="layer" text-anchor="middle">3  Gold</text>
  <text x="487.0" y="158" class="where" text-anchor="middle">gold, tables</text>
  <text x="436" y="184" class="body">The rules:</text>
  <text x="436" y="202" class="body">delivered, late</text>
  <text x="436" y="220" class="body">(after 0 days),</text>
  <text x="436" y="238" class="body">seller late rank,</text>
  <text x="436" y="256" class="body">top 100 sellers</text>
  <line x1="436" y1="270" x2="538" y2="270" stroke="#E2E8F0"/>
  <text x="436" y="292" class="bold">99,441 orders</text>
  <text x="436" y="312" class="count">3,095 sellers</text>
  <line x1="549" y1="218" x2="562" y2="218" class="edge" marker-end="url(#arrow)"/>
  <rect x="564" y="100" width="122" height="236" rx="14" fill="#F8FAFC" stroke="#14B8A6" stroke-width="1.5"/>
  <rect x="572" y="112" width="106" height="26" rx="13" fill="#14B8A6"/><text x="625.0" y="130" class="layer" text-anchor="middle">4  Semantic</text>
  <text x="625.0" y="158" class="where" text-anchor="middle">semantic, tables</text>
  <text x="574" y="184" class="body">The star schema:</text>
  <text x="574" y="202" class="body">one fact per order</text>
  <text x="574" y="220" class="body">item; dimensions</text>
  <text x="574" y="238" class="body">from Silver and</text>
  <text x="574" y="256" class="body">Gold</text>
  <line x1="574" y1="270" x2="676" y2="270" stroke="#E2E8F0"/>
  <text x="574" y="292" class="bold">112,650 items</text>
  <text x="574" y="312" class="count">4 dimensions</text>
  <line x1="687" y1="218" x2="700" y2="218" class="edge" marker-end="url(#arrow)"/>
  <rect x="702" y="100" width="122" height="236" rx="14" fill="#F8FAFC" stroke="#A855F7" stroke-width="1.5"/>
  <rect x="710" y="112" width="106" height="26" rx="13" fill="#A855F7"/><text x="763.0" y="130" class="layer" text-anchor="middle">5  Analytical</text>
  <text x="763.0" y="158" class="where" text-anchor="middle">analytical, views</text>
  <text x="712" y="184" class="body">Summary views over</text>
  <text x="712" y="202" class="body">the star schema:</text>
  <text x="712" y="220" class="body">by month, by</text>
  <text x="712" y="238" class="body">seller, review by</text>
  <text x="712" y="256" class="body">lateness</text>
  <line x1="712" y1="270" x2="814" y2="270" stroke="#E2E8F0"/>
  <text x="712" y="292" class="bold">3 views</text>
  <text x="712" y="312" class="count">24 months</text>
  <line x1="825" y1="218" x2="838" y2="218" class="edge" marker-end="url(#arrow)"/>
  <rect x="840" y="100" width="122" height="236" rx="14" fill="#F8FAFC" stroke="#22C55E" stroke-width="1.5"/>
  <rect x="848" y="112" width="106" height="26" rx="13" fill="#22C55E"/><text x="901.0" y="130" class="layer" text-anchor="middle">6  Reporting</text>
  <text x="901.0" y="158" class="where" text-anchor="middle">notebook, Power BI</text>
  <text x="850" y="184" class="body">Reads Semantic and</text>
  <text x="850" y="202" class="body">Analytical only:</text>
  <text x="850" y="220" class="body">sales, suppliers,</text>
  <text x="850" y="238" class="body">late deliveries</text>
  <line x1="850" y1="270" x2="952" y2="270" stroke="#E2E8F0"/>
  <text x="850" y="292" class="bold">3 report pages</text>
  <text x="850" y="312" class="count">README numbers</text>
  <rect x="18" y="352" width="944" height="36" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-dasharray="4 4"/>
  <text x="40" y="375" class="body">Not a layer: <tspan font-weight="700">ops.load_log</tspan> records every load (rows in the file, loaded, refused). One run: python load.py, then dbt run.</text>
</svg>

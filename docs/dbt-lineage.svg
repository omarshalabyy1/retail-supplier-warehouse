<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 568" width="1000" height="568" role="img" aria-label="dbt lineage, left to right: 7 Bronze sources feed 7 Silver views; the Gold layer's order_delivery reads Silver orders, and seller_late_rank reads Silver order items and sellers plus order_delivery; the Semantic layer's fact_order_items reads Silver orders, order items and reviews plus Gold order_delivery, dim_seller reads Silver sellers and the Gold rank, dim_product reads Silver products and departments, dim_customer and dim_date read Silver; the 3 Analytical views read the fact, dim_date and dim_seller.">

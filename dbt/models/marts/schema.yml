version: 2

models:
  - name: dim_date
    columns:
      - name: date
        data_tests: [unique, not_null]

  - name: dim_product
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: department
        data_tests: [not_null]

  - name: dim_seller
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: dim_customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: fact_order_items
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: order_item_id
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_product'), field: product_id}}
      - name: seller_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_seller'), field: seller_id}}
      - name: customer_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_customer'), field: customer_id}}
      - name: order_date
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_date'), field: date}}
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: price
        data_tests: [not_null]
      - name: freight
        data_tests: [not_null]
      - name: review_score
        data_tests:
          - accepted_values: {arguments: {values: [1, 2, 3, 4, 5], quote: false}}

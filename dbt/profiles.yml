# Connection values come from config/client.yaml through the DAG (dags/retail_warehouse.py sets these).
retail_warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST') }}"
      port: "{{ env_var('WAREHOUSE_PORT') | int }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DATABASE') }}"
      schema: public
      threads: 4

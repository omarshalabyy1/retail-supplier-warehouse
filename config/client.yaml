# Everything a client changes, except secrets (those go in .env).
# Read only through config.py (load_config). A key exists here only if something reads it.

client:
  name: Sample online store          # notebook and chart titles
  currency: BRL                      # the label printed with every amount
  decimals: 2                        # decimals on amounts in the notebook

warehouse:                           # as seen from your laptop; the password is DB_PASSWORD in .env
  host: 127.0.0.1
  port: 5441                         # if you change it, change the ports line in docker-compose.yml too
  database: warehouse                # if you change it or the user, change docker-compose.yml too
  user: warehouse

inputs:                              # file names in data/input/ (columns: data/input/README.md)
  orders: olist_orders_dataset.csv
  order_items: olist_order_items_dataset.csv
  products: olist_products_dataset.csv
  sellers: olist_sellers_dataset.csv
  customers: olist_customers_dataset.csv
  reviews: olist_order_reviews_dataset.csv
  departments: departments.csv

rules:
  late_after_days: 0                 # an order delivered more than this many days after the promised date is late
  top_sellers: 100                   # how many sellers, most late items first, count as the "top sellers"

schedule:                            # when Airflow refreshes the warehouse
  cron: "0 6 * * *"
  timezone: Africa/Cairo

report:
  title: Retail Supplier Warehouse   # the Power BI theme name
  check_year: 2017                   # the year powerbi/06-checks.md uses to test the year slicer
  min_state_items: 500               # the state chart on page 2 leaves out states with fewer delivered items
  colours:                           # the Power BI theme (python theme.py) and the notebook charts
    data: ["#2563EB", "#0E1630", "#8DB0FF", "#4A5675", "#1D4FD7", "#C7D7FE"]   # 1st = main series
    text: "#0E1630"
    muted: "#4A5675"
    page: "#F4F6FB"
    line: "#E2E7F1"
    danger: "#C2410C"
